name: Запуск бота

# Запуск вручную: вкладка Actions → «Запуск бота» → Run workflow.
# Токен бота берётся из секрета репозитория TELEGRAM_BOT_TOKEN (Settings → Secrets and variables → Actions).
# Бот работает, пока идёт запуск (не дольше 5 ч 50 мин — лимит GitHub Actions 6 ч), потом останавливается.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут работать (1–350)"
        required: true
        default: "60"

# Одновременно может работать только один экземпляр бота: новый запуск останавливает старый
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      # Цены из ваших корзин (Озон Фреш) между запусками хранятся в кэше GitHub
      # в зашифрованном виде (ключ — секрет TELEGRAM_BOT_TOKEN, чужим он недоступен).
      - name: Восстановить сохранённые цены
        uses: actions/cache/restore@v4
        with:
          path: data/user_prices.enc
          key: user-prices-${{ github.run_id }}
          restore-keys: user-prices-
      - name: Расшифровать сохранённые цены
        env:
          KEY: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -f data/user_prices.enc ] && [ -n "$KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in data/user_prices.enc -out data/user_prices.json \
              && echo "Сохранённые цены восстановлены" || echo "::warning::Не удалось расшифровать сохранённые цены"
          else
            echo "Сохранённых цен пока нет"
          fi

      - name: Работа бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REGION: Москва
          MINUTES: ${{ inputs.minutes }}
          # Условия доставки Озон Фреш — переменные репозитория (Settings → Secrets and variables →
          # Actions → вкладка Variables). Не заданы — доставка Озон Фреш не учитывается.
          OZON_FRESH_DELIVERY_FEE: ${{ vars.OZON_FRESH_DELIVERY_FEE }}
          OZON_FRESH_FREE_FROM: ${{ vars.OZON_FRESH_FREE_FROM }}
          OZON_FRESH_MIN_ORDER: ${{ vars.OZON_FRESH_MIN_ORDER }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Нет секрета TELEGRAM_BOT_TOKEN. Добавьте его: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || [ "$MINUTES" -lt 1 ] || [ "$MINUTES" -gt 350 ]; then
            echo "::error::minutes должно быть числом от 1 до 350"
            exit 1
          fi
          echo "Бот работает $MINUTES мин."
          set +e
          timeout -s INT "${MINUTES}m" python bot.py
          code=$?
          # 124 — бот остановлен по таймеру, это нормальное завершение
          if [ "$code" -eq 124 ] || [ "$code" -eq 0 ]; then exit 0; fi
          exit "$code"

      - name: Зашифровать цены
        if: always()
        env:
          KEY: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -f data/user_prices.json ] && [ -n "$KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -in data/user_prices.json -out data/user_prices.enc
            rm -f data/user_prices.json
          fi
      - name: Сохранить цены до следующего запуска
        if: always() && hashFiles('data/user_prices.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: data/user_prices.enc
          key: user-prices-${{ github.run_id }}-${{ github.run_attempt }}
